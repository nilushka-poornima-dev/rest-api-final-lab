<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Student Management</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold"><i class="bi bi-mortarboard-fill me-2"></i>Student Management System</span>
  </div>
</nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">All Students <span class="badge bg-primary" th:text="${students.size()}">0</span></h5>
    <a href="/students/new" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Add Student</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-primary">
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Age</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="s : ${students}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.name}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.course}"></td>
            <td th:text="${s.age}"></td>
            <td class="text-center">
              <a th:href="@{/students/{id}/edit(id=${s.id})}" class="btn btn-sm me-1">
                <i class="bi bi-pencil-fill"></i> Edit
              </a>
              <a th:href="@{/students/{id}/delete(id=${s.id})}" class="btn btn-sm"
                 onclick="return confirm('Delete this student?')">
                <i class="bi bi-trash-fill"></i> Delete
              </a>
            </td>
          </tr>
          <tr th:if="${students.isEmpty()}">
            <td colspan="6" class="text-center text-muted py-4">No students found. Click "Add Student" to get started.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
