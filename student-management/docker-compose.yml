version: '3.8'
services:
  book-postgres:
    image: postgres:15-alpine
    container_name: book-postgres
    environment:
      POSTGRES_DB: labtest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: labtest123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  student-app:
    build: .
    container_name: student-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: book-postgres
      DB_USER: postgres
      DB_PASS: labtest123
    depends_on:
      - book-postgres

volumes:
  postgres_data:
