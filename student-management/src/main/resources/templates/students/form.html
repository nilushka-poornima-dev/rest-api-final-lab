<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${isEdit} ? 'Edit Student' : 'Add Student'">Student Form</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold"><i class="bi bi-mortarboard-fill me-2"></i>Student Management System</span>
  </div>
</nav>

<div class="container">
  <div class="card shadow-sm mx-auto" style="max-width:520px">
    <div class="card-header bg-primary text-white fw-bold">
      <i class="bi bi-person-fill me-2"></i>
      <span th:text="${isEdit} ? 'Edit Student' : 'Add New Student'"></span>
    </div>
    <div class="card-body">

      <!-- CREATE form -->
      <form th:if="${!isEdit}" th:action="@{/students}" th:object="${student}" method="post">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" th:field="*{name}" required placeholder="Full name"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" th:field="*{email}" required placeholder="email@example.com"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Course</label>
          <input type="text" class="form-control" th:field="*{course}" required placeholder="e.g. Computer Science"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Age</label>
          <input type="number" class="form-control" th:field="*{age}" required min="1" max="100"/>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary flex-fill"><i class="bi bi-save me-1"></i>Save</button>
          <a href="/students" class="btn btn-secondary flex-fill"><i class="bi bi-x-lg me-1"></i>Cancel</a>
        </div>
      </form>

      <!-- EDIT form -->
      <form th:if="${isEdit}" th:action="@{/students/{id}(id=${student.id})}" th:object="${student}" method="post">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" th:field="*{name}" required/>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" th:field="*{email}" required/>
        </div>
        <div class="mb-3">
          <label class="form-label">Course</label>
          <input type="text" class="form-control" th:field="*{course}" required/>
        </div>
        <div class="mb-3">
          <label class="form-label">Age</label>
          <input type="number" class="form-control" th:field="*{age}" required min="1" max="100"/>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-warning flex-fill"><i class="bi bi-pencil me-1"></i>Update</button>
          <a href="/students" class="btn btn-secondary flex-fill"><i class="bi bi-x-lg me-1"></i>Cancel</a>
        </div>
      </form>

    </div>
  </div>
</div>

</body>
</html>
