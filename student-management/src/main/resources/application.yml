server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:student-postgres}:5432/labtest
    username: ${DB_USER:postgres}
    password: ${DB_PASS:labtest123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
